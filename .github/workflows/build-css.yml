name: Build CSS

# Rebuilds styles.css whenever the page or Tailwind setup changes, so any
# Tailwind class added to index.html (even from GitHub's web editor) gets styled.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/input.css
      - tailwind.config.js
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:css

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then echo "styles.css already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rebuild styles.css"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Request Pages rebuild
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the push may still trigger one"
