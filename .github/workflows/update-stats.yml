name: Update Stroll stats

on:
  schedule:
    # Tuesdays 06:17 UTC, giving Jolpica time to load the weekend's results
    - cron: '17 6 * * 2'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch stats and update index.html
        run: node scripts/update-stats.mjs

      # The "updated" date changes every run, so this commits weekly. That also
      # keeps GitHub from disabling the schedule during the off-season.
      - name: Commit and push
        run: |
          if git diff --quiet; then echo "Nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Stroll stats"
          git push

      # Pushes made with the workflow token may not kick off a Pages build on their own
      - name: Request Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the push may still trigger one"
